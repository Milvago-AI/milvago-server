# Milvago theme overrides. Keycloak merges this file with its own bundle: only the
# keys present here replace its defaults.
#
# `reauthenticate` is the subtitle shown when the console asks for a step-up
# (`prompt=login` + `max_age=0`, see server/internal/app/auth.go). The stock text,
# "Please re-authenticate to continue", says neither who is asking nor why: arriving
# here from a single click on Save, there is no telling which action is waiting.
# Keycloak is not given that detail — it would take a dedicated authenticator — so the
# message states what holds for every case.
reauthenticate=This Milvago console action affects personal data or the security policy. Confirm your identity so that it is applied.
