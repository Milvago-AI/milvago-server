# Milvago theme overrides. Keycloak merges this file with its own bundle: only the keys
# present here replace its own.
#
# `reauthenticate` is the subtitle shown when the console asks for step-up authentication
# (`prompt=login` + `max_age=0`, see server/internal/app/auth.go). Keycloak's own text
# ("Please re-authenticate to continue") says neither who asks nor why: arriving there after
# a mere click on Save, the person cannot tell which action is waiting. Keycloak does not
# receive that action's detail — it would take a dedicated authenticator — so the message
# names what holds in every case.
reauthenticate=Cette action de la console Milvago touche à des données personnelles ou à la politique de sécurité. Confirmez votre identité pour qu'elle soit appliquée.
