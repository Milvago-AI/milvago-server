# Milvago theme texts. Keycloak merges this file with its own bundle: the mv* keys are
# this theme's own, the others replace Keycloak's wording where the pages show it.
# Keycloak formats every message with MessageFormat, where a straight apostrophe is an
# escape character: these texts use the typographic one.

