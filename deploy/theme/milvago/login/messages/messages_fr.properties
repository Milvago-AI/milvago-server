# Surcharges du thème Milvago. Keycloak fusionne ce fichier avec son propre bundle :
# seules les clés présentes ici remplacent les siennes.
#
# `reauthenticate` est le sous-titre affiché quand la console demande une élévation
# (`prompt=login` + `max_age=0`, voir server/internal/app/auth.go). Le texte d'origine,
# « Merci de vous authentifier à nouveau pour continuer », ne dit ni qui demande ni
# pourquoi : arrivé là après un simple clic sur Enregistrer, on ne sait pas quelle
# action est en attente. Keycloak ne reçoit pas le détail de cette action — il faudrait
# un authenticator dédié — donc le message nomme ce qui est vrai de tous les cas.
reauthenticate=Cette action de la console Milvago touche à des données personnelles ou à la politique de sécurité. Confirmez votre identité pour qu'elle soit appliquée.
