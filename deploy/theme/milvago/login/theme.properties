# Milvago sign-in theme. Built on Keycloak's unstyled `base` theme: template.ftl draws
# the same frame as the console entry page, the pages people actually meet are
# rewritten, and every other page (identity-provider linking, authenticator choice,
# profile fields...) keeps Keycloak's markup but receives the Milvago classes below.
parent=base
import=common/keycloak
styles=css/milvago.css
scripts=js/milvago.js
locales=en,fr,es,pt-BR

# Class names read by Keycloak's templates, mapped onto the console's own.
# Empty values switch off Keycloak's grid helpers, which this frame does not use.
kcHtmlClass=
kcBodyClass=
kcFormClass=auth
kcFormGroupClass=field
kcFormSettingClass=
kcContentWrapperClass=
kcLabelWrapperClass=field-head
kcLabelClass=label
kcInputWrapperClass=field-input
kcInputClass=input
kcTextareaClass=input
kcInputGroup=input-group
kcInputErrorMessageClass=field-error
kcInputHelperTextBeforeClass=field-hint
kcInputHelperTextAfterClass=field-hint
kcInputClassCheckbox=check
kcInputClassCheckboxInput=
kcInputClassCheckboxLabel=
kcInputClassRadio=check
kcInputClassRadioInput=
kcInputClassRadioLabel=
kcCheckboxInputClass=
kcCheckInputClass=
kcFormOptionsClass=
kcFormOptionsWrapperClass=field-options
kcFormButtonsClass=actions
kcFormButtonsWrapperClass=actions
kcButtonClass=button
kcButtonPrimaryClass=primary
kcButtonSecondaryClass=
kcButtonDefaultClass=
kcButtonBlockClass=
kcButtonLargeClass=
kcFormPasswordVisibilityButtonClass=icon-button reveal
kcFormPasswordVisibilityIconShow=mv-eye
kcFormPasswordVisibilityIconHide=mv-eye-off
kcAlertClass=notice
kcAlertTitleClass=
kcSignUpClass=
kcInfoAreaWrapperClass=
kcMarginTopClass=
kcFormSocialAccountSectionClass=mv-sso-section
kcFormSocialAccountListClass=mv-sso
kcFormSocialAccountListGridClass=
kcFormSocialAccountListButtonClass=button
kcFormSocialAccountListButtonDisabledClass=is-disabled
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=
kcCommonLogoIdP=
kcLoginOTPListClass=choice
kcLoginOTPListInputClass=
kcLoginOTPListItemHeaderClass=
kcLoginOTPListItemIconBodyClass=
kcLoginOTPListItemIconClass=
kcLoginOTPListItemTitleClass=
kcSelectAuthListClass=choices
kcSelectAuthListItemClass=choice
kcSelectAuthListItemIconClass=
kcSelectAuthListItemIconPropertyClass=
kcSelectAuthListItemBodyClass=
kcSelectAuthListItemHeadingClass=
kcSelectAuthListItemTitle=
kcSelectAuthListItemDescriptionClass=field-hint
