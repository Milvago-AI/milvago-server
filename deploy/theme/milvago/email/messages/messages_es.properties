# Milvago e-mail texts. Keycloak merges this file with its own bundle and formats every
# message with MessageFormat, where a straight apostrophe is an escape character: these
# texts use the typographic one. Values given to the templates are escaped there.

# Shared frame. {0} is the address the e-mail was sent to.
mvEmailFooter=Milvago · Este correo se envió a {0}.
mvEmailLinkFallback=¿El botón no funciona? Copie este enlace en su navegador:

# Invitation: the console sends Keycloak's "execute actions" e-mail only to invite a member.
# {0} is the invited address; mvInviteExpiry's {0} is the link's validity in words.
executeActionsSubject=Su invitación a Milvago
mvInviteEyebrow=Invitación
mvInviteTitle=Le invitamos a Milvago
mvInviteIntro=Su organización le invita a unirse a Milvago, el espacio que da una visión clara de cómo se usa la IA. Active su cuenta {0} eligiendo su contraseña.
mvInviteAction=Activar mi cuenta
# Sent instead when the invitation signs in with the organization’s provider (no password).
mvInviteDirectIntro=Su organización le invita a unirse a Milvago con su cuenta de trabajo {0} (Google o Microsoft). Confirme su dirección y luego inicie sesión con esa cuenta: no hay que crear ninguna contraseña.
mvInviteDirectAction=Confirmar mi dirección
mvInviteExpiry=Este enlace es válido durante {0} y solo funciona una vez. Pasado ese plazo, pida una nueva invitación a la persona que le invitó. Si no esperaba esta invitación, ignore este correo: no se activará ninguna cuenta.

# Forgotten password. {0} is the account’s address.
passwordResetSubject=Restablezca su contraseña de Milvago
mvResetEmailEyebrow=Contraseña olvidada
mvResetEmailTitle=Restablezca su contraseña
mvResetEmailIntro=Alguien ha solicitado restablecer la contraseña de su cuenta de Milvago {0}. Elija una nueva con el botón de abajo.
mvResetEmailAction=Elegir una nueva contraseña
mvResetEmailExpiry=Este enlace es válido durante {0} y solo funciona una vez. Si no lo solicitó, ignore este correo: su contraseña seguirá siendo la misma.

# Confirming an address. {0} is the address to confirm.
emailVerificationSubject=Confirme su dirección de correo electrónico para Milvago
emailUpdateConfirmationSubject=Confirme su nueva dirección de correo electrónico para Milvago
mvVerifyEmailEyebrow=Su cuenta
mvVerifyEmailTitle=Confirme su dirección de correo electrónico
mvVerifyEmailIntro=Confirme que {0} es la dirección de su cuenta de Milvago.
mvVerifyEmailAction=Confirmar mi dirección
mvVerifyEmailExpiry=Este enlace es válido durante {0}. Si no lo solicitó, ignore este correo.
mvUpdateEmailTitle=Confirme su nueva dirección
mvUpdateEmailIntro=Ha solicitado usar {0} como dirección de su cuenta de Milvago. Confírmelo con el botón de abajo.
mvUpdateEmailAction=Confirmar la nueva dirección
