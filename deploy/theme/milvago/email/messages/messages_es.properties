# Milvago e-mail overrides. The console sends Keycloak's "execute actions" e-mail only to
# invite a member (verify the address, choose a password), so it is worded as an invitation.
# {0} is the activation link, {4} its validity in words.
executeActionsSubject=Su invitación a Milvago
executeActionsBody=Hola:\n\nHa sido invitado a unirse a la consola Milvago.\n\nPara activar su cuenta, abra el enlace siguiente: confirmará su dirección de correo electrónico y después elegirá su contraseña.\n\n{0}\n\nEste enlace es válido durante {4}. Pasado ese plazo, pida una nueva invitación a la persona que le invitó.\n\nSi no esperaba esta invitación, puede ignorar este mensaje.
executeActionsBodyHtml=<p>Hola:</p><p>Ha sido invitado a unirse a la consola Milvago.</p><p>Para activar su cuenta, abra el enlace siguiente: confirmará su dirección de correo electrónico y después elegirá su contraseña.</p><p><a href="{0}">Activar mi cuenta</a></p><p>Este enlace es válido durante {4}. Pasado ese plazo, pida una nueva invitación a la persona que le invitó.</p><p>Si no esperaba esta invitación, puede ignorar este mensaje.</p>
# Sent instead when the invitation signs in with the organization's provider (no password).
milvagoDirectInvitationBody=Hola:\n\nHa sido invitado a unirse a la consola Milvago con la cuenta de su organización.\n\nAbra el enlace siguiente para confirmar su dirección de correo electrónico y, después, haga clic en «Iniciar sesión» y elija Google o Microsoft, según la cuenta de su organización: no hay que crear ninguna contraseña.\n\n{0}\n\nEste enlace es válido durante {4}. Pasado ese plazo, pida una nueva invitación a la persona que le invitó.\n\nSi no esperaba esta invitación, puede ignorar este mensaje.
milvagoDirectInvitationBodyHtml=<p>Hola:</p><p>Ha sido invitado a unirse a la consola Milvago con la cuenta de su organización.</p><p>Abra el enlace siguiente para confirmar su dirección de correo electrónico y, después, haga clic en «Iniciar sesión» y elija Google o Microsoft, según la cuenta de su organización: no hay que crear ninguna contraseña.</p><p><a href="{0}">Confirmar mi dirección</a></p><p>Este enlace es válido durante {4}. Pasado ese plazo, pida una nueva invitación a la persona que le invitó.</p><p>Si no esperaba esta invitación, puede ignorar este mensaje.</p>
