# Milvago e-mail overrides. The console sends Keycloak's "execute actions" e-mail only to
# invite a member (verify the address, choose a password), so it is worded as an invitation.
# {0} is the activation link, {4} its validity in words.
executeActionsSubject=Votre invitation à Milvago
executeActionsBody=Bonjour,\n\nVous êtes invité à rejoindre la console Milvago.\n\nPour activer votre compte, ouvrez le lien ci-dessous : vous confirmerez votre adresse e-mail, puis vous choisirez votre mot de passe.\n\n{0}\n\nCe lien est valable {4}. Passé ce délai, demandez une nouvelle invitation à la personne qui vous a invité.\n\nSi vous n’attendiez pas cette invitation, vous pouvez ignorer ce message.
executeActionsBodyHtml=<p>Bonjour,</p><p>Vous êtes invité à rejoindre la console Milvago.</p><p>Pour activer votre compte, ouvrez le lien ci-dessous : vous confirmerez votre adresse e-mail, puis vous choisirez votre mot de passe.</p><p><a href="{0}">Activer mon compte</a></p><p>Ce lien est valable {4}. Passé ce délai, demandez une nouvelle invitation à la personne qui vous a invité.</p><p>Si vous n’attendiez pas cette invitation, vous pouvez ignorer ce message.</p>
# Sent instead when the invitation signs in with the organization's provider (no password).
milvagoDirectInvitationBody=Bonjour,\n\nVous êtes invité à rejoindre la console Milvago avec le compte de votre organisation.\n\nOuvrez le lien ci-dessous pour confirmer votre adresse e-mail, puis cliquez sur « Se connecter » et choisissez Google ou Microsoft, selon le compte de votre organisation : aucun mot de passe à créer.\n\n{0}\n\nCe lien est valable {4}. Passé ce délai, demandez une nouvelle invitation à la personne qui vous a invité.\n\nSi vous n’attendiez pas cette invitation, vous pouvez ignorer ce message.
milvagoDirectInvitationBodyHtml=<p>Bonjour,</p><p>Vous êtes invité à rejoindre la console Milvago avec le compte de votre organisation.</p><p>Ouvrez le lien ci-dessous pour confirmer votre adresse e-mail, puis cliquez sur « Se connecter » et choisissez Google ou Microsoft, selon le compte de votre organisation : aucun mot de passe à créer.</p><p><a href="{0}">Confirmer mon adresse</a></p><p>Ce lien est valable {4}. Passé ce délai, demandez une nouvelle invitation à la personne qui vous a invité.</p><p>Si vous n’attendiez pas cette invitation, vous pouvez ignorer ce message.</p>
