# Milvago e-mail texts. Keycloak merges this file with its own bundle and formats every
# message with MessageFormat, where a straight apostrophe is an escape character: these
# texts use the typographic one. Values given to the templates are escaped there.

# Shared frame. {0} is the address the e-mail was sent to.
mvEmailFooter=Milvago · Cet e-mail a été envoyé à {0}.
mvEmailLinkFallback=Le bouton ne fonctionne pas ? Copiez ce lien dans votre navigateur :

# Invitation: the console sends Keycloak's "execute actions" e-mail only to invite a member.
# {0} is the invited address; mvInviteExpiry's {0} is the link's validity in words.
executeActionsSubject=Votre invitation à Milvago
mvInviteEyebrow=Invitation
mvInviteTitle=Vous êtes invité sur Milvago
mvInviteIntro=Votre organisation vous invite à rejoindre Milvago, l’espace qui donne une vue claire des usages de l’IA. Activez votre compte {0} en choisissant votre mot de passe.
mvInviteAction=Activer mon compte
# Sent instead when the invitation signs in with the organization’s provider (no password).
mvInviteDirectIntro=Votre organisation vous invite à rejoindre Milvago avec votre compte professionnel {0} (Google ou Microsoft). Confirmez votre adresse, puis connectez-vous avec ce compte : aucun mot de passe à créer.
mvInviteDirectAction=Confirmer mon adresse
mvInviteExpiry=Ce lien est valable {0} et ne sert qu’une fois. Passé ce délai, demandez une nouvelle invitation à la personne qui vous a invité. Si vous n’attendiez pas cette invitation, ignorez simplement cet e-mail : aucun compte ne sera activé.

# Forgotten password. {0} is the account’s address.
passwordResetSubject=Réinitialisez votre mot de passe Milvago
mvResetEmailEyebrow=Mot de passe oublié
mvResetEmailTitle=Réinitialisez votre mot de passe
mvResetEmailIntro=Une demande de réinitialisation du mot de passe de votre compte Milvago {0} a été faite. Choisissez-en un nouveau avec le bouton ci-dessous.
mvResetEmailAction=Choisir un nouveau mot de passe
mvResetEmailExpiry=Ce lien est valable {0} et ne sert qu’une fois. Si vous n’êtes pas à l’origine de cette demande, ignorez cet e-mail : votre mot de passe reste inchangé.

# Confirming an address. {0} is the address to confirm.
emailVerificationSubject=Confirmez votre adresse e-mail pour Milvago
emailUpdateConfirmationSubject=Confirmez votre nouvelle adresse e-mail pour Milvago
mvVerifyEmailEyebrow=Votre compte
mvVerifyEmailTitle=Confirmez votre adresse e-mail
mvVerifyEmailIntro=Confirmez que {0} est bien l’adresse de votre compte Milvago.
mvVerifyEmailAction=Confirmer mon adresse
mvVerifyEmailExpiry=Ce lien est valable {0}. Si vous n’êtes pas à l’origine de cette demande, ignorez cet e-mail.
mvUpdateEmailTitle=Confirmez votre nouvelle adresse
mvUpdateEmailIntro=Vous avez demandé à utiliser {0} comme adresse de votre compte Milvago. Confirmez-la avec le bouton ci-dessous.
mvUpdateEmailAction=Confirmer la nouvelle adresse
