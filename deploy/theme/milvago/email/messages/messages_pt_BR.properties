# Milvago e-mail overrides. The console sends Keycloak's "execute actions" e-mail only to
# invite a member (verify the address, choose a password), so it is worded as an invitation.
# {0} is the activation link, {4} its validity in words.
executeActionsSubject=Seu convite para o Milvago
executeActionsBody=Olá,\n\nVocê foi convidado para o console Milvago.\n\nPara ativar sua conta, abra o link abaixo: você vai confirmar seu endereço de e-mail e depois escolher sua senha.\n\n{0}\n\nEste link é válido por {4}. Depois desse prazo, peça um novo convite à pessoa que convidou você.\n\nSe você não esperava este convite, pode ignorar esta mensagem.
executeActionsBodyHtml=<p>Olá,</p><p>Você foi convidado para o console Milvago.</p><p>Para ativar sua conta, abra o link abaixo: você vai confirmar seu endereço de e-mail e depois escolher sua senha.</p><p><a href="{0}">Ativar minha conta</a></p><p>Este link é válido por {4}. Depois desse prazo, peça um novo convite à pessoa que convidou você.</p><p>Se você não esperava este convite, pode ignorar esta mensagem.</p>
# Sent instead when the invitation signs in with the organization's provider (no password).
milvagoDirectInvitationBody=Olá,\n\nVocê foi convidado para o console Milvago com a conta da sua organização.\n\nAbra o link abaixo para confirmar seu endereço de e-mail, depois clique em “Entrar” e escolha Google ou Microsoft, conforme a conta da sua organização: não é preciso criar senha.\n\n{0}\n\nEste link é válido por {4}. Depois desse prazo, peça um novo convite à pessoa que convidou você.\n\nSe você não esperava este convite, pode ignorar esta mensagem.
milvagoDirectInvitationBodyHtml=<p>Olá,</p><p>Você foi convidado para o console Milvago com a conta da sua organização.</p><p>Abra o link abaixo para confirmar seu endereço de e-mail, depois clique em “Entrar” e escolha Google ou Microsoft, conforme a conta da sua organização: não é preciso criar senha.</p><p><a href="{0}">Confirmar meu endereço</a></p><p>Este link é válido por {4}. Depois desse prazo, peça um novo convite à pessoa que convidou você.</p><p>Se você não esperava este convite, pode ignorar esta mensagem.</p>
