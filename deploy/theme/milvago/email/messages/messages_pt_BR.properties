# Milvago e-mail texts. Keycloak merges this file with its own bundle and formats every
# message with MessageFormat, where a straight apostrophe is an escape character: these
# texts use the typographic one. Values given to the templates are escaped there.

# Shared frame. {0} is the address the e-mail was sent to.
mvEmailFooter=Milvago · Este e-mail foi enviado para {0}.
mvEmailLinkFallback=O botão não funciona? Copie este link no seu navegador:

# Invitation: the console sends Keycloak's "execute actions" e-mail only to invite a member.
# {0} is the invited address; mvInviteExpiry's {0} is the link's validity in words.
executeActionsSubject=Seu convite para o Milvago
mvInviteEyebrow=Convite
mvInviteTitle=Você foi convidado para o Milvago
mvInviteIntro=Sua organização convida você a participar do Milvago, o espaço que dá uma visão clara de como a IA é usada. Ative sua conta {0} escolhendo sua senha.
mvInviteAction=Ativar minha conta
# Sent instead when the invitation signs in with the organization’s provider (no password).
mvInviteDirectIntro=Sua organização convida você a participar do Milvago com sua conta de trabalho {0} (Google ou Microsoft). Confirme seu endereço e depois entre com essa conta: não é preciso criar senha.
mvInviteDirectAction=Confirmar meu endereço
mvInviteExpiry=Este link é válido por {0} e funciona apenas uma vez. Depois desse prazo, peça um novo convite à pessoa que convidou você. Se você não esperava este convite, simplesmente ignore este e-mail: nenhuma conta será ativada.

# Forgotten password. {0} is the account’s address.
passwordResetSubject=Redefina sua senha do Milvago
mvResetEmailEyebrow=Senha esquecida
mvResetEmailTitle=Redefina sua senha
mvResetEmailIntro=Alguém pediu para redefinir a senha da sua conta do Milvago {0}. Escolha uma nova com o botão abaixo.
mvResetEmailAction=Escolher uma nova senha
mvResetEmailExpiry=Este link é válido por {0} e funciona apenas uma vez. Se você não fez esse pedido, ignore este e-mail: sua senha continuará a mesma.

# Confirming an address. {0} is the address to confirm.
emailVerificationSubject=Confirme seu endereço de e-mail para o Milvago
emailUpdateConfirmationSubject=Confirme seu novo endereço de e-mail para o Milvago
mvVerifyEmailEyebrow=Sua conta
mvVerifyEmailTitle=Confirme seu endereço de e-mail
mvVerifyEmailIntro=Confirme que {0} é o endereço da sua conta do Milvago.
mvVerifyEmailAction=Confirmar meu endereço
mvVerifyEmailExpiry=Este link é válido por {0}. Se você não fez esse pedido, ignore este e-mail.
mvUpdateEmailTitle=Confirme seu novo endereço
mvUpdateEmailIntro=Você pediu para usar {0} como endereço da sua conta do Milvago. Confirme com o botão abaixo.
mvUpdateEmailAction=Confirmar o novo endereço
