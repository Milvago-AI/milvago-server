# Milvago e-mail texts. Keycloak merges this file with its own bundle and formats every
# message with MessageFormat, where a straight apostrophe is an escape character: these
# texts use the typographic one. Values given to the templates are escaped there.

# Shared frame. {0} is the address the e-mail was sent to.
mvEmailFooter=Milvago · This e-mail was sent to {0}.
mvEmailLinkFallback=Button not working? Copy this link into your browser:

# Invitation: the console sends Keycloak's "execute actions" e-mail only to invite a member.
# {0} is the invited address; mvInviteExpiry's {0} is the link's validity in words.
executeActionsSubject=Your invitation to Milvago
mvInviteEyebrow=Invitation
mvInviteTitle=You are invited to Milvago
mvInviteIntro=Your organization invites you to join Milvago, the space that gives a clear view of how AI is used. Activate your account {0} by choosing your password.
mvInviteAction=Activate my account
# Sent instead when the invitation signs in with the organization’s provider (no password).
mvInviteDirectIntro=Your organization invites you to join Milvago with your work account {0} (Google or Microsoft). Confirm your address, then sign in with that account: there is no password to create.
mvInviteDirectAction=Confirm my address
mvInviteExpiry=This link is valid for {0} and works only once. After that, ask the person who invited you for a new invitation. If you were not expecting this invitation, simply ignore this e-mail: no account will be activated.

# Forgotten password. {0} is the account’s address.
passwordResetSubject=Reset your Milvago password
mvResetEmailEyebrow=Forgotten password
mvResetEmailTitle=Reset your password
mvResetEmailIntro=Someone asked to reset the password of your Milvago account {0}. Choose a new one with the button below.
mvResetEmailAction=Choose a new password
mvResetEmailExpiry=This link is valid for {0} and works only once. If you did not ask for it, ignore this e-mail: your password stays the same.

# Confirming an address. {0} is the address to confirm.
emailVerificationSubject=Confirm your e-mail address for Milvago
emailUpdateConfirmationSubject=Confirm your new e-mail address for Milvago
mvVerifyEmailEyebrow=Your account
mvVerifyEmailTitle=Confirm your e-mail address
mvVerifyEmailIntro=Confirm that {0} is the address of your Milvago account.
mvVerifyEmailAction=Confirm my address
mvVerifyEmailExpiry=This link is valid for {0}. If you did not ask for it, ignore this e-mail.
mvUpdateEmailTitle=Confirm your new address
mvUpdateEmailIntro=You asked to use {0} as the address of your Milvago account. Confirm it with the button below.
mvUpdateEmailAction=Confirm the new address
