# Milvago e-mail overrides. The console sends Keycloak's "execute actions" e-mail only to
# invite a member (verify the address, choose a password), so it is worded as an invitation.
# {0} is the activation link, {4} its validity in words.
executeActionsSubject=Your invitation to Milvago
executeActionsBody=Hello,\n\nYou have been invited to the Milvago console.\n\nTo activate your account, open the link below: you will confirm your e-mail address, then choose your password.\n\n{0}\n\nThis link is valid for {4}. After that, ask the person who invited you for a new invitation.\n\nIf you were not expecting this invitation, you can ignore this message.
executeActionsBodyHtml=<p>Hello,</p><p>You have been invited to the Milvago console.</p><p>To activate your account, open the link below: you will confirm your e-mail address, then choose your password.</p><p><a href="{0}">Activate my account</a></p><p>This link is valid for {4}. After that, ask the person who invited you for a new invitation.</p><p>If you were not expecting this invitation, you can ignore this message.</p>
# Sent instead when the invitation signs in with the organization's provider (no password).
milvagoDirectInvitationBody=Hello,\n\nYou have been invited to the Milvago console with your organization’s account.\n\nOpen the link below to confirm your e-mail address, then click “Sign in” and choose Google or Microsoft, whichever your organization uses: there is no password to create.\n\n{0}\n\nThis link is valid for {4}. After that, ask the person who invited you for a new invitation.\n\nIf you were not expecting this invitation, you can ignore this message.
milvagoDirectInvitationBodyHtml=<p>Hello,</p><p>You have been invited to the Milvago console with your organization’s account.</p><p>Open the link below to confirm your e-mail address, then click “Sign in” and choose Google or Microsoft, whichever your organization uses: there is no password to create.</p><p><a href="{0}">Confirm my address</a></p><p>This link is valid for {4}. After that, ask the person who invited you for a new invitation.</p><p>If you were not expecting this invitation, you can ignore this message.</p>
