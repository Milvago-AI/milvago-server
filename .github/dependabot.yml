# Every dependency is pinned to an exact version (or digest): an upgrade is an explicit,
# reviewed change, never a resolution side effect. Dependabot proposes those changes as pull
# requests, grouped per ecosystem to keep review manageable.
# Stage version updates on dev; main requires a separately versioned release.
version: 2
updates:
  - package-ecosystem: gomod
    target-branch: dev
    directory: /server
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    target-branch: dev
    directory: /console
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    target-branch: dev
    directory: /deploy
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
