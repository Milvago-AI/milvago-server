# This workflow is the standing proof that the published tree builds on its own: it knows
# only this repository — no monorepo, no internal registry, no secret.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - run: node --test scripts/server-release.test.mjs scripts/installer-url.test.mjs scripts/installer-docker.test.mjs
      - run: node scripts/server-release.mjs check
      - run: node scripts/check-production-installer.mjs
      - run: node scripts/check-production-installer.mjs --localhost

  dev-image:
    needs: [release-policy, distroless, console, server]
    if: github.event_name == 'push' && github.repository == 'Milvago-AI/milvago-server' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr.yml
    secrets: inherit

  release-image:
    needs: [release-policy, distroless, console, server]
    if: github.event_name == 'push' && github.repository == 'Milvago-AI/milvago-server' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/ghcr.yml
    secrets: inherit

  # Every shipped image is distroless: the last stage of each Dockerfile — the one that
  # ships — starts from a gcr.io/distroless base pinned by digest, or from scratch. Build and
  # verification stages are unrestricted.
  distroless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: the token must not stay on disk for later steps.
          persist-credentials: false
      - run: |
          bad=0
          for f in $(git ls-files 'Dockerfile' '*/Dockerfile' '*.Dockerfile'); do
            last=$(grep -iE '^[[:space:]]*FROM[[:space:]]' "$f" | tail -n 1)
            case "$last" in
              *distroless/*@sha256:*|*[Ff][Rr][Oo][Mm]\ scratch*) ;;
              *) echo "::error file=$f::shipped image is not distroless: $last"; bad=1;;
            esac
          done
          exit $bad

  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: console
      - run: rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.96.1 test --locked --manifest-path dlp-engine/Cargo.toml
      - run: sh scripts/build-dlp.sh
      - run: sh scripts/build-discovery.sh
      - run: npm test
        working-directory: console
      - run: npm run build
        working-directory: console

  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown
      - run: sh scripts/build-dlp.sh
      - run: sh scripts/build-discovery.sh
      # No build tag: this builds and tests the Community edition.
      - run: go test ./...
        working-directory: server
      # Trivy only sees the final image; govulncheck reads the call paths actually reachable in
      # the source. A non-zero exit fails the job.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: server
      - run: go build -trimpath ./cmd/milvago
        working-directory: server

  discovery-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      database:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: milvago_test
        options: >-
          --publish 127.0.0.1:5432:5432
          --health-cmd "pg_isready -U fixture_admin -d milvago_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DISCOVERY_FIXTURE_ADMIN_URL: postgres://fixture_admin:fixture-only@127.0.0.1/milvago_test?sslmode=disable
      TEST_DATABASE_URL: postgres://milvago_runtime:fixture-runtime@127.0.0.1/milvago_test?sslmode=disable
      TEST_MIGRATION_DATABASE_URL: postgres://milvago_migration:fixture-migration@127.0.0.1/milvago_test?sslmode=disable
      MILVAGO_REQUIRE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown
      - run: sh scripts/build-dlp.sh && sh scripts/build-discovery.sh
      - run: go run ../scripts/discovery-fixture.go
        working-directory: server
      - run: MILVAGO_INVENTORY_LOAD=1 go test ./internal/app -run 'TestDiscovery|TestInventorySearch|TestLegacyConversationPage|TestPaginatedMetadata' -count=1 -timeout=8m
        working-directory: server

  discovery-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: discovery-integration
    strategy:
      fail-fast: false
      matrix:
        profile: [Smoke, FleetSmoke, FleetDenseSmoke, DNSHintsSmoke]
    services:
      database:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: milvago_test
        options: >-
          --publish 127.0.0.1:5432:5432
          --health-cmd "pg_isready -U fixture_admin -d milvago_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DISCOVERY_FIXTURE_ADMIN_URL: postgres://fixture_admin:fixture-only@127.0.0.1/milvago_test?sslmode=disable
      TEST_DATABASE_URL: postgres://milvago_runtime:fixture-runtime@127.0.0.1/milvago_test?sslmode=disable
      TEST_MIGRATION_DATABASE_URL: postgres://milvago_migration:fixture-migration@127.0.0.1/milvago_test?sslmode=disable
      MILVAGO_REQUIRE_INTEGRATION: '1'
      MILVAGO_DISCOVERY_LOAD_SMOKE: '1'
      DISCOVERY_LOAD_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown
      - run: sh scripts/build-dlp.sh && sh scripts/build-discovery.sh
      - run: go run ../scripts/discovery-fixture.go
        working-directory: server
      # Each unchanged load profile owns a fresh fixture and its own bounded budget.
      - run: |
          result=0
          go test ./internal/app -run "^TestDiscoveryLoad${DISCOVERY_LOAD_PROFILE}$" -count=1 -timeout=8m -cpuprofile="$RUNNER_TEMP/discovery.cpu" || result=$?
          if [ "$result" -ne 0 ]; then
            go tool pprof -top -nodecount=35 "$RUNNER_TEMP/discovery.cpu" || :
            go tool pprof -top -cum -nodecount=35 "$RUNNER_TEMP/discovery.cpu" || :
          fi
          exit "$result"
        working-directory: server
