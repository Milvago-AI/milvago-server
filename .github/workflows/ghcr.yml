name: Publish versioned Community image

on:
  workflow_call:

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Milvago-AI/milvago-server' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'
      - name: Check release and source visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/server-release.mjs check
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
      - name: Choose immutable image tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/server-release.mjs metadata
      - name: Reject a public development package before pushing
        if: github.ref_name == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output package.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/milvago-server-dev")
          case "$status" in
            200) test "$(node -p "JSON.parse(require('fs').readFileSync('package.json')).visibility")" = private ;;
            404) ;; # GitHub creates new packages as private.
            *) echo "Cannot verify development package visibility (HTTP $status)" >&2; exit 1 ;;
          esac
      - name: Authenticate registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Reuse existing immutable image
        if: steps.release.outputs.existing != ''
        env:
          EXISTING: ${{ steps.release.outputs.existing }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          docker pull "$EXISTING"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$EXISTING")" = "$GITHUB_SHA"
          docker tag "$EXISTING" "$IMAGE"
      - name: Build Community image
        if: steps.release.outputs.existing == ''
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker build --pull --no-cache -f deploy/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$IMAGE" .
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = 65532:65532
      - name: Scan image before publishing
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.release.outputs.image }}
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '1'
      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Publish and sign image
        id: signed
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          EXISTING: ${{ steps.release.outputs.existing }}
          COMMUNITY_COSIGN_PRIVATE_KEY: ${{ secrets.COMMUNITY_COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COMMUNITY_COSIGN_PASSWORD }}
        run: |
          test -n "$COMMUNITY_COSIGN_PRIVATE_KEY"
          test -n "$COSIGN_PASSWORD"
          if [ -z "$EXISTING" ]; then docker push "$IMAGE"; fi
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          digest=${reference##*@}
          case "$digest" in sha256:*) ;; *) exit 1;; esac
          cosign sign --key env://COMMUNITY_COSIGN_PRIVATE_KEY --tlog-upload=false --use-signing-config=false "$IMAGE@$digest"
          cosign verify --key cosign.pub --insecure-ignore-tlog=true "$IMAGE@$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Signed image: `%s@%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce package visibility
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.release.outputs.package }}
          PRODUCTION: ${{ steps.release.outputs.production }}
        run: |
          expected=private
          if [ "$PRODUCTION" = true ]; then expected=public; fi
          actual=$(gh api "orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$PACKAGE" --jq .visibility)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Package $PACKAGE must be $expected. Set package visibility in GitHub and rerun this workflow."
            exit 1
          fi
      - name: Verify anonymous production pull
        if: steps.release.outputs.production == 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.signed.outputs.digest }}
        run: |
          anonymous_config=$(mktemp -d)
          docker --config "$anonymous_config" pull "$IMAGE@$DIGEST"
      - name: Create exact-version installer
        if: steps.release.outputs.production == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.signed.outputs.digest }}
        run: |
          node scripts/server-release.mjs render
          bash -n release/install-private.sh
      - name: Publish server release
        if: steps.release.outputs.production == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Milvago $VERSION" --draft --generate-notes --latest=false
          fi
          mkdir -p previous-release
          for name in install-private.sh release.json SHA256SUMS; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release download "$tag" --pattern "$name" --dir previous-release
              cmp "release/$name" "previous-release/$name"
            else
              gh release upload "$tag" "release/$name"
            fi
          done
          gh release edit "$tag" --draft=false --latest=false
